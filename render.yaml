services:
  - type: web
    name: cropai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_AUTH_USER
        sync: false
      - key: SMTP_AUTH_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEATHERSTACK_API_KEY
        sync: false
      - key: PLANT_ID_API_KEY
        sync: false
      - key: KINDWISE_API_KEY
        sync: false
