<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CropAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/cropai-favicon.png?v=20260428c">
    <link rel="apple-touch-icon" href="images/cropai-apple-touch.png?v=20260428c">
    <style>
        :root {
            --primary-green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.2);
            --bg-light: #f8faf9;
            --text-dark: #1a1a1a;
            --text-muted: #666666;
            --border-color: #eeeeee;
        }

        body {
            background-color: var(--bg-light);
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .reset-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            text-align: center;
            animation: cardFade 0.6s ease-out;
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-circle {
            width: 60px;
            height: 60px;
            background: #fff;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 35px;
        }

        .field-label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group-custom i.prefix-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
            font-size: 16px;
        }

        .input-group-custom .form-control {
            padding: 15px 50px 15px 50px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group-custom .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px var(--green-glow);
        }

        .eye-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }

        .eye-toggle:hover {
            color: var(--primary-green);
        }

        .submit-btn {
            background: var(--primary-green);
            color: #050a06;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 255, 136, 0.3);
            background: #00e077;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: left;
        }

        .strength-meter {
            height: 4px;
            background: #eee;
            margin-top: -15px;
            margin-bottom: 25px;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new password below.</p>

        <div id="alertContainer"></div>

        <form id="resetPasswordForm">
            <label class="field-label">New Password</label>
            <div class="input-group-custom">
                <i class="fas fa-lock prefix-icon"></i>
                <input type="password" id="password" class="form-control" placeholder="New Password" required minlength="6">
                <i class="fas fa-eye eye-toggle" id="toggleP1"></i>
            </div>
            <div class="strength-meter">
                <div id="strengthFill" class="strength-fill"></div>
            </div>

            <label class="field-label">Confirm Password</label>
            <div class="input-group-custom">
                <i class="fas fa-lock prefix-icon"></i>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm New Password" required minlength="6">
                <i class="fas fa-eye eye-toggle" id="toggleP2"></i>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-key"></i> Reset Password
            </button>
        </form>
    </div>

    <script>
        // Toggle Visibility
        function setupToggle(toggleId, inputId) {
            document.getElementById(toggleId).onclick = function() {
                const input = document.getElementById(inputId);
                if (input.type === "password") {
                    input.type = "text";
                    this.className = "fas fa-eye-slash eye-toggle";
                } else {
                    input.type = "password";
                    this.className = "fas fa-eye eye-toggle";
                }
            };
        }
        setupToggle('toggleP1', 'password');
        setupToggle('toggleP2', 'confirmPassword');

        // Strength Meter
        document.getElementById('password').oninput = function() {
            const val = this.value;
            const fill = document.getElementById('strengthFill');
            let s = 0;
            if (val.length >= 6) s += 25;
            if (val.length >= 10) s += 25;
            if (/[A-Z]/.test(val)) s += 25;
            if (/[0-9]/.test(val)) s += 25;

            fill.style.width = s + '%';
            fill.style.background = s <= 25 ? '#ff4d4d' : s <= 50 ? '#ffae00' : s <= 75 ? '#00ccff' : '#00cc66';
        };

        // Submit
        document.getElementById('resetPasswordForm').onsubmit = async function(e) {
            e.preventDefault();
            const p = document.getElementById('password').value;
            const cp = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alertContainer');

            if (p !== cp) {
                alertBox.innerHTML = '<div class="alert alert-danger">Passwords do not match!</div>';
                return;
            }

            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                alertBox.innerHTML = '<div class="alert alert-danger">Invalid or missing token. Use the link from your email.</div>';
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = 'Resetting...';

            try {
                const res = await fetch('/api/reset-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: p, confirmPassword: cp })
                });
                const data = await res.json();
                if (res.ok) {
                    alertBox.innerHTML = '<div class="alert alert-success">Password reset successful! Redirecting to login...</div>';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger">${data.error || 'Error resetting password'}</div>`;
                    btn.disabled = false;
                    btn.innerHTML = 'Reset Password';
                }
            } catch (err) {
                alertBox.innerHTML = '<div class="alert alert-danger">Connection error. Try again.</div>';
                btn.disabled = false;
                btn.innerHTML = 'Reset Password';
            }
        };
    </script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
