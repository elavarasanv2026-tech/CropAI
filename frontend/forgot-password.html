<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CropAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="images/cropai-favicon.png?v=20260428c">
    <link rel="apple-touch-icon" href="images/cropai-apple-touch.png?v=20260428c">
    <style>
        :root {
            /* Futuristic Jungle Palette - Consistent with Dashboard */
            --primary-color: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.5);
            --primary-dim: rgba(0, 255, 136, 0.1);
            --secondary-color: #050a06;
            --accent-color: #00e5ff;
            --cyber-purple: #bc13fe;

            --text-main: #e0f2e9;
            --text-muted: #8aa395;

            --bg-body: #020402;
            --container-bg: rgba(10, 20, 15, 0.5);
            --border-color: rgba(0, 255, 136, 0.15);
            --input-bg: rgba(0, 30, 20, 0.3);
            --input-text: #e0f2e9;
            --glass-bg: rgba(0, 255, 136, 0.05);

            --neon-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        [data-theme="light"] {
            /* Premium Ethereal Day Palette */
            --primary-dim: rgba(0, 143, 76, 0.1);
            --secondary-color: #f0fdf4;
            --bg-body: #ced9d5;
            /* Premium Sage Grey */
            --text-main: #051f15;
            --container-bg: #f5f7f6;
            --border-color: rgba(0, 143, 76, 0.15);
            --input-bg: #ffffff;
            --input-text: #022c22;
            --glass-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
            padding: 20px 0;
        }

        /* Environmental Overlays */
        .environmental-overlays { display: none !important;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 500;
        }

        .dark-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(2, 4, 3, 0.7) 100%);
        }

        /* Animated Background Blobs */
        .blob-container { display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            
            opacity: 0.4;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0);
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            animation: moveBlob 20s infinite alternate;
        }

        .blob-1 {
            background: rgba(0, 255, 136, 0.15);
            top: -100px;
            left: -100px;
            animation-duration: 25s;
        }

        .blob-2 {
            background: rgba(188, 19, 254, 0.1);
            bottom: -150px;
            right: -100px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes moveBlob {
            0% {
                transform: translate(0, 0) scale(1);
                rotate: 0deg;
            }

            33% {
                transform: translate(100px, 200px) scale(1.2);
                rotate: 120deg;
            }

            66% {
                transform: translate(-150px, 100px) scale(0.8);
                rotate: 240deg;
            }

            100% {
                transform: translate(0, 0) scale(1);
                rotate: 360deg;
            }
        }

        .login-container {
            background: var(--container-bg);
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            backdrop-filter: saturate(160%);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            position: relative;
            z-index: 10;
            animation: containerEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            padding: 2rem !important;
        }

        @keyframes containerEntrance {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-label {
            font-weight: 600;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-control {
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            background: var(--input-bg);
            color: var(--input-text);
            
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(0, 255, 136, 0.05);
            color: var(--input-text);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #00a85d);
            border: none;
            border-radius: 16px;
            padding: 16px 35px;
            font-weight: 800;
            font-size: 1.1rem;
            color: #050a06 !important;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 255, 136, 0.3);
            background: linear-gradient(135deg, #33ffa3, #00d174);
        }

        .btn-primary:active {
            transform: translateY(-1px) scale(1);
        }

        .input-group-text {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-right: none;
            border-radius: 16px 0 0 16px;
            color: var(--primary-color);
            transition: all 0.3s ease;
            width: 50px;
            justify-content: center;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 16px 16px 0;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(0, 255, 136, 0.05);
        }
    </style>
</head>

<body>
    <!-- Environmental Overlays -->
    <div class="environmental-overlays">
        <div class="dark-vignette"></div>
    </div>

    <!-- Animated Blobs -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-container p-4">
                    <div class="text-center mb-4">
                        <img src="images/logo.svg" alt="CropAI Logo"
                            style="width: 80px; height: 80px; margin-bottom: 1rem;">
                        <h2 class="form-title" style="
                            background: linear-gradient(135deg, #fff 0%, var(--primary-color) 100%);
                            -webkit-background-clip: text;
                            background-clip: text;
                            -webkit-text-fill-color: transparent;
                            font-weight: 800;
                            letter-spacing: -1px;
                            margin-bottom: 0.25rem;">Forgot Password</h2>
                        <p class="text-muted mb-0">Enter your email to receive a reset link</p>
                    </div>

                    <div id="alertContainer" class="mb-3"></div>

                    <form id="forgotPasswordForm">
                        <div class="mb-4">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" name="email" required
                                    placeholder="john@example.com">
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary">Send Reset Link</button>
                        </div>

                        <div class="text-center">
                            <a href="login.html" class="text-muted text-decoration-none small">
                                <i class="fas fa-arrow-left me-1"></i>Back to Login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = this.querySelector('input[name="email"]').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

            try {
                const response = await fetch('/api/forgot-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(result.message, 'success');
                } else {
                    showAlert(result.error || 'Failed to send request.', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('An error occurred. Please try again.', 'danger');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            alertContainer.innerHTML = alertHTML;
        }
    </script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</body>

</html>
